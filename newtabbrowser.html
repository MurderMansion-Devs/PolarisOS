<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Polaris New Tab</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            font-family:
            'Segoe UI Variable Text',
            'Segoe UI',
            sans-serif;
        }

        body{

            overflow:hidden;

            height:100vh;

            background:
            linear-gradient(
                180deg,
                #171717,
                #111111
            );

            color:white;
        }

        /* Acrylic */

        .acrylic{

            position:absolute;

            inset:0;

            background:

            radial-gradient(
                circle at top left,
                rgba(0,120,215,0.15),
                transparent 40%
            ),

            radial-gradient(
                circle at bottom right,
                rgba(0,153,188,0.12),
                transparent 35%
            );

            filter:blur(40px);
        }

        /* Top */

        .topBar{

            position:absolute;

            top:0;
            left:0;

            width:100%;
            height:48px;

            display:flex;

            align-items:center;
            justify-content:space-between;

            padding:0 18px;

            background:
            rgba(255,255,255,0.03);

            border-bottom:
            1px solid rgba(255,255,255,0.05);

            backdrop-filter:blur(24px);
        }

        .brand{

            font-size:15px;

            color:#f3f3f3;

            font-weight:500;
        }

        .clock{

            color:#cfcfcf;

            font-size:13px;
        }

        /* Main */

        .container{

            position:relative;

            z-index:2;

            height:100vh;

            display:flex;

            flex-direction:column;

            justify-content:center;
            align-items:center;
        }

        .logo{

            font-size:64px;

            font-weight:200;

            margin-bottom:8px;
        }

        .subtitle{

            color:#bdbdbd;

            font-size:15px;

            margin-bottom:36px;
        }

        /* Search */

        .searchContainer{

            width:700px;

            max-width:92%;

            background:
            rgba(255,255,255,0.06);

            border:
            1px solid rgba(255,255,255,0.08);

            border-radius:4px;

            backdrop-filter:blur(24px);

            transition:0.18s ease;
        }

        .searchContainer:hover{

            background:
            rgba(255,255,255,0.08);
        }

        .searchContainer:focus-within{

            border:
            1px solid #3aa0ff;

            box-shadow:
            0 0 0 1px #3aa0ff;
        }

        .searchBox{

            width:100%;

            height:54px;

            border:none;
            outline:none;

            background:transparent;

            color:white;

            padding:0 18px;

            font-size:17px;
        }

        .searchBox::placeholder{

            color:#9f9f9f;
        }

        /* Suggestions */

        .suggestions{

            width:700px;

            max-width:92%;

            margin-top:6px;

            background:#1f1f1f;

            border:
            1px solid rgba(255,255,255,0.08);

            border-radius:4px;

            overflow:hidden;

            display:none;
        }

        .suggestion{

            padding:12px 16px;

            cursor:pointer;

            transition:0.15s;
        }

        .suggestion:hover{

            background:
            rgba(255,255,255,0.06);
        }

        /* Tiles */

        .tiles{

            margin-top:34px;

            display:grid;

            grid-template-columns:
            repeat(4, 120px);

            gap:14px;
        }

        .tile{

            width:120px;
            height:120px;

            background:
            rgba(255,255,255,0.045);

            border:
            1px solid rgba(255,255,255,0.06);

            border-radius:4px;

            display:flex;

            flex-direction:column;

            justify-content:center;
            align-items:center;

            cursor:pointer;

            transition:0.14s ease;
        }

        .tile:hover{

            background:
            rgba(255,255,255,0.08);

            transform:scale(1.02);
        }

        .tile:active{

            transform:scale(0.98);
        }

        .tileIcon{

            font-size:30px;

            margin-bottom:10px;
        }

        .tileText{

            font-size:13px;

            color:#e0e0e0;
        }

        /* Weather */

        .weather{

            position:absolute;

            left:20px;
            bottom:60px;

            width:220px;

            padding:16px;

            background:
            rgba(255,255,255,0.04);

            border:
            1px solid rgba(255,255,255,0.05);

            border-radius:4px;

            backdrop-filter:blur(20px);
        }

        .weatherTitle{

            font-size:14px;

            color:#9fd3ff;

            margin-bottom:8px;
        }

        .weatherTemp{

            font-size:32px;

            font-weight:200;
        }

        .weatherDesc{

            margin-top:4px;

            color:#bfbfbf;
        }

        /* Bottom */

        .bottomBar{

            position:absolute;

            bottom:0;
            left:0;

            width:100%;
            height:42px;

            display:flex;

            align-items:center;
            justify-content:center;

            background:
            rgba(255,255,255,0.025);

            border-top:
            1px solid rgba(255,255,255,0.05);

            color:#9d9d9d;

            font-size:12px;

            backdrop-filter:blur(20px);
        }

    </style>

</head>

<body>

    <div class="acrylic"></div>

    <!-- Top -->

    <div class="topBar">

        <div class="brand">
            Polaris
        </div>

        <div class="clock" id="clock"></div>

    </div>

    <!-- Main -->

    <div class="container">

        <div class="logo">
            Polaris
        </div>

        <div class="subtitle">
            Search the web or enter an address
        </div>

        <div class="searchContainer">

            <input
                class="searchBox"
                id="search"
                type="text"
                autocomplete="off"
                placeholder="Search or enter website">

        </div>

        <!-- Suggestions -->

        <div class="suggestions" id="suggestions">

            <div
                class="suggestion"
                onclick="goTo('https://youtube.com')">

                Visit YouTube

            </div>

            <div
                class="suggestion"
                onclick="goTo('https://github.com')">

                Open GitHub

            </div>

            <div
                class="suggestion"
                onclick="goTo('https://reddit.com')">

                Browse Reddit

            </div>

        </div>

        <!-- Tiles -->

        <div class="tiles">

            <div
                class="tile"
                onclick="goTo('https://youtube.com')">

                <div class="tileIcon">▶</div>

                <div class="tileText">
                    YouTube
                </div>

            </div>

            <div
                class="tile"
                onclick="goTo('https://github.com')">

                <div class="tileIcon">⌘</div>

                <div class="tileText">
                    GitHub
                </div>

            </div>

            <div
                class="tile"
                onclick="goTo('https://reddit.com')">

                <div class="tileIcon">☰</div>

                <div class="tileText">
                    Reddit
                </div>

            </div>

            <div
                class="tile"
                onclick="goTo('https://openai.com')">

                <div class="tileIcon">✦</div>

                <div class="tileText">
                    OpenAI
                </div>

            </div>

        </div>

    </div>

    <!-- Weather -->

    <div class="weather">

        <div class="weatherTitle">
            Current Weather
        </div>

        <div class="weatherTemp">
            72°
        </div>

        <div class="weatherDesc">
            Clear skies
        </div>

    </div>

    <!-- Bottom -->

    <div class="bottomBar">

        Polaris Browser • UWP Inspired Experience

    </div>

    <script>

async function loadWeather(){

    try{

        const city =
        encodeURIComponent('Tampa, FL');

        const response =
        await fetch(
            `https://wttr.in/${city}?format=j1`
        );

        if(!response.ok){

            throw new Error(
                'Weather request failed'
            );
        }

        const data =
        await response.json();

        const current =
        data.current_condition[0];

        document.querySelector(
            '.weatherTemp'
        ).innerText =
        current.temp_F + '°';

        document.querySelector(
            '.weatherDesc'
        ).innerText =
        current.weatherDesc[0].value;
    }
    catch(error){

        console.error(error);

        document.querySelector(
            '.weatherTemp'
        ).innerText =
        '--°';

        document.querySelector(
            '.weatherDesc'
        ).innerText =
        'Weather unavailable';
    }
}

loadWeather();

</script>

</body>

</html>
